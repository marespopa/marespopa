name: Release AI Skills

on:
  push:
    tags:
      - "skills-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create skills-only archive
        run: |
          mkdir -p dist
          zip -r dist/marespopa-ai-skills.zip skills -x "skills/.DS_Store"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/marespopa-ai-skills.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/marespopa-ai-skills.zip \
              --title "AI Skills $GITHUB_REF_NAME" \
              --generate-notes
          fi
